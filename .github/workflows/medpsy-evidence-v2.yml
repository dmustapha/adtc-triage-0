name: MedPsy raw and profiler evidence v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medpsy-raw-profiler-v2
  cancel-in-progress: false

jobs:
  raw-profiler-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MODEL_REPOSITORY: qvac/MedPsy-1.7B-GGUF
      MODEL_REVISION: fd4cecc90c2de8dce4b112795456a54be9c59363
      MODEL_FILENAME: medpsy-1.7b-q4_k_m-imat.gguf
      MODEL_BYTES: "1282439360"
      MODEL_SHA256: 41ee947d9cce72ec657577219fd1798fabeabf0d832217fe23c9d6d3d18d5880
      MODEL_URL: https://huggingface.co/qvac/MedPsy-1.7B-GGUF/resolve/fd4cecc90c2de8dce4b112795456a54be9c59363/medpsy-1.7b-q4_k_m-imat.gguf
      LLAMA_REVISION: c8ade30036139e32108fee53d8b7164dbfda4bee
      RUN_DIR: evidence/medpsy-raw-profiler-v2/remote-run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Verify and freeze local producers
        run: |
          npm ci
          node --import tsx --test tests/medpsy-raw-profiler-v2.test.ts
          npm run typecheck
          mkdir -p "$RUN_DIR"
          node --import tsx scripts/medpsy-raw-profiler-v2/freeze-manifest.ts "$RUN_DIR/producer-manifest.json"

      - name: Build pinned official llama.cpp CPU runtime
        run: |
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$LLAMA_REVISION"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-cli --parallel 2
          echo "$RUNNER_TEMP/llama.cpp/build/bin" >> "$GITHUB_PATH"

      - name: Download and verify exact immutable GGUF
        run: |
          mkdir -p model
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 10800 --continue-at - --output "model/$MODEL_FILENAME.partial" "$MODEL_URL"
          test "$(stat -c %s "model/$MODEL_FILENAME.partial")" = "$MODEL_BYTES"
          echo "$MODEL_SHA256  model/$MODEL_FILENAME.partial" | sha256sum --check --strict
          mv "model/$MODEL_FILENAME.partial" "model/$MODEL_FILENAME"

      - name: Run frozen raw calibration
        run: |
          node --import tsx scripts/medpsy-raw-profiler-v2/run-raw.ts config/medpsy-product-v2/calibration-corpus.json "$RUN_DIR/producer-manifest.json" "$RUN_DIR/raw-calibration.json"
          node --import tsx scripts/medpsy-raw-profiler-v2/evaluate.ts "$RUN_DIR/raw-calibration.json" "$RUN_DIR/calibration-evaluation.json"

      - name: Run bounded healthcare profiler prompts after calibration
        if: success()
        run: |
          node --import tsx scripts/medpsy-raw-profiler-v2/run-raw.ts metadata.json "$RUN_DIR/producer-manifest.json" "$RUN_DIR/raw-profiler.json"
          node --import tsx scripts/medpsy-raw-profiler-v2/evaluate.ts "$RUN_DIR/raw-profiler.json" "$RUN_DIR/profiler-evaluation.json"
          sha256sum "$RUN_DIR/producer-manifest.json" "$RUN_DIR/raw-calibration.json" "$RUN_DIR/calibration-evaluation.json" "$RUN_DIR/raw-profiler.json" "$RUN_DIR/profiler-evaluation.json" > "$RUN_DIR/hashes.sha256"

      - name: Remove model bytes, partials, and caches before upload
        if: always()
        run: rm -rf model "$HOME/.qvac" "$HOME/.cache/huggingface" "$RUNNER_TEMP/llama.cpp"

      - name: Upload strict raw evidence allowlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medpsy-raw-profiler-v2-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            evidence/medpsy-raw-profiler-v2/remote-run/producer-manifest.json
            evidence/medpsy-raw-profiler-v2/remote-run/raw-calibration.json
            evidence/medpsy-raw-profiler-v2/remote-run/calibration-evaluation.json
            evidence/medpsy-raw-profiler-v2/remote-run/raw-profiler.json
            evidence/medpsy-raw-profiler-v2/remote-run/profiler-evaluation.json
            evidence/medpsy-raw-profiler-v2/remote-run/hashes.sha256
